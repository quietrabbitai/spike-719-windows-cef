<!doctype html>
<html><head><meta charset="utf-8"><title>popup</title></head>
<body style="font:14px system-ui;padding:16px">
<h3>OAuth-style popup (local)</h3>
<p>window.opener present: <b id="o"></b></p>
<p><button onclick="opener && opener.postMessage('popup-done', '*'); window.close()">Finish and close</button></p>
<script>document.getElementById('o').textContent = String(!!window.opener);</script>
</body></html>
