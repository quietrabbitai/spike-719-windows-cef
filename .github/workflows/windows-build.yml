# THROWAWAY SPIKE (items.id=719). Builds the Windows test binary on a GitHub-hosted runner and uploads it
# as a workflow artifact. Nothing here signs, publishes, releases or contacts anything beyond GitHub itself
# and the CEF build index (cef-builds.spotifycdn.com, what the cef crate's own build script downloads from).
name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CEF_PATH: ${{ github.workspace }}\.cef-cache
    steps:
      - uses: actions/checkout@v4

      # Same pin as quietrabbit-core's rust-toolchain.toml.
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The cef-dll-sys build script downloads the "minimal" CEF distribution (~170 MB); cache it between
      # runs. Saved even when the build fails, so a failed round does not cost the download again.
      - name: Restore CEF distribution cache
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: .cef-cache
          key: cef-151.1.0-windows-x64-v1

      # FINDING (CI round 1): the cef crate downloads the "minimal" distribution, which does NOT contain
      # cef_sandbox.lib. The Windows sandbox needs it (decisions.id=860), so fetch the "standard"
      # distribution of the exact same CEF version, verify its SHA-1 from the official index, and extract
      # only cef_sandbox.lib.
      - name: Restore cef_sandbox.lib cache
        id: sbx-cache
        uses: actions/cache/restore@v4
        with:
          path: .cef-sandbox
          key: cef-sandbox-151.3.12-v1

      - name: Fetch cef_sandbox.lib (standard distribution, same CEF version)
        if: steps.sbx-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "cef_binary_151.3.12+gd9cea67+chromium-151.0.7922.47_windows64.tar.bz2"
          $url = "https://cef-builds.spotifycdn.com/" + [uri]::EscapeDataString($name)
          curl.exe -fsSL -o std.tar.bz2 $url
          $sha1 = (Get-FileHash std.tar.bz2 -Algorithm SHA1).Hash.ToLower()
          Write-Host "sha1 = $sha1"
          if ($sha1 -ne "57eeca57bade7855fc9907c699ae8a35fc30e9b7") { throw "standard distribution SHA-1 mismatch" }
          New-Item -ItemType Directory -Force .cef-sandbox | Out-Null
          New-Item -ItemType Directory -Force std-extract | Out-Null
          tar -xjf std.tar.bz2 -C std-extract --wildcards "*/Release/cef_sandbox.lib"
          $lib = Get-ChildItem std-extract -Recurse -Filter cef_sandbox.lib | Select-Object -First 1
          if (-not $lib) { throw "cef_sandbox.lib not found in the standard distribution" }
          Copy-Item $lib.FullName .cef-sandbox\cef_sandbox.lib
          Get-Item .cef-sandbox\cef_sandbox.lib | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Remove-Item std.tar.bz2, std-extract -Recurse -Force

      - name: Save cef_sandbox.lib cache
        if: steps.sbx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cef-sandbox
          key: cef-sandbox-151.3.12-v1

      # cef-dll-sys drives CMake with the Ninja generator, which needs cl.exe on PATH.
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1

      - name: Build (release)
        env:
          CEF_SANDBOX_LIB_DIR: ${{ github.workspace }}\.cef-sandbox
        run: cargo build --release --locked

      - name: Save CEF distribution cache
        if: always() && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cef-cache
          key: cef-151.1.0-windows-x64-v1

      - name: Package
        shell: pwsh
        run: |
          $rel = "target\release"
          $out = "pkg\spike719"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem $rel -File | Where-Object { $_.Extension -in ".exe",".dll",".pak",".bin",".dat",".json" } |
            Where-Object { $_.Name -notlike "build-script-*" } | Copy-Item -Destination $out
          if (Test-Path "$rel\locales") { Copy-Item "$rel\locales" "$out\locales" -Recurse }
          Copy-Item README.md, RUN_STEPS.md, RESULTS_TEMPLATE.md $out
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          Compress-Archive -Path "$out\*" -DestinationPath "pkg\spike719-windows-x64.zip"
          $h = (Get-FileHash "pkg\spike719-windows-x64.zip" -Algorithm SHA256).Hash
          Write-Host "SHA256 spike719-windows-x64.zip = $h"
          "SHA256=$h" | Out-File -Encoding ascii "pkg\SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spike719-windows-x64
          path: |
            pkg/spike719-windows-x64.zip
            pkg/SHA256.txt
          retention-days: 14
          if-no-files-found: error
