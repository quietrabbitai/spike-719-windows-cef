# THROWAWAY SPIKE (items.id=719). Builds the Windows test binary on a GitHub-hosted runner and uploads it
# as a workflow artifact. Nothing here signs, publishes, releases or contacts anything beyond GitHub itself
# and the CEF build index (cef-builds.spotifycdn.com, what the cef crate's own build script downloads from).
name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CEF_PATH: ${{ github.workspace }}\.cef-cache
    steps:
      - uses: actions/checkout@v4

      # Same pin as quietrabbit-core's rust-toolchain.toml.
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The cef-dll-sys build script downloads the "minimal" CEF distribution (~170 MB); cache it between
      # runs. Saved even when the build fails, so a failed round does not cost the download again.
      - name: Restore CEF distribution cache
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: .cef-cache
          key: cef-151.1.0-windows-x64-v1

      # cef-dll-sys drives CMake with the Ninja generator, which needs cl.exe on PATH.
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1

      - name: Build (release)
        run: cargo build --release --locked

      - name: Save CEF distribution cache
        if: always() && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cef-cache
          key: cef-151.1.0-windows-x64-v1

      # CEF 151's Windows sandbox model: bootstrap.exe (contains the sandbox broker) is renamed to the app
      # name and loads <app>.dll, calling its RunWinMain export. cef-rs's own bundler does the same copy.
      - name: Package
        shell: pwsh
        run: |
          $rel = "target\release"
          $out = "pkg\spike719"
          New-Item -ItemType Directory -Force $out | Out-Null
          # The CEF runtime comes from the CEF distribution directory itself: copying it out of target\release only
          # works on a cold build (cef-dll-sys copies it there from its build script, which a cache hit skips).
          $libcef = Get-ChildItem .cef-cache -Recurse -Filter libcef.dll | Select-Object -First 1
          if (-not $libcef) { throw "libcef.dll not found in the CEF cache" }
          $cefdir = $libcef.DirectoryName
          Get-ChildItem $cefdir -File | Where-Object { $_.Extension -in ".dll",".pak",".bin",".dat",".json" -and $_.Name -ne "archive.json" } | Copy-Item -Destination $out
          Copy-Item "$cefdir\locales" "$out\locales" -Recurse
          Copy-Item "$rel\spike719.dll" $out
          $boot = Get-ChildItem .cef-cache -Recurse -Filter bootstrap.exe | Select-Object -First 1
          if (-not $boot) { throw "bootstrap.exe not found in the CEF distribution" }
          Copy-Item $boot.FullName "$out\spike719.exe"
          foreach ($need in "spike719.dll","libcef.dll","chrome_elf.dll","resources.pak","icudtl.dat") {
            if (-not (Test-Path "$out\$need")) { throw "$need missing from the package" }
          }
          Copy-Item README.md, RUN_STEPS.md, RESULTS_TEMPLATE.md $out
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          Compress-Archive -Path "$out\*" -DestinationPath "pkg\spike719-windows-x64.zip"
          $h = (Get-FileHash "pkg\spike719-windows-x64.zip" -Algorithm SHA256).Hash
          Write-Host "SHA256 spike719-windows-x64.zip = $h"
          "SHA256=$h" | Out-File -Encoding ascii "pkg\SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spike719-windows-x64
          path: |
            pkg/spike719-windows-x64.zip
            pkg/SHA256.txt
          retention-days: 14
          if-no-files-found: error

  # Functional smoke test on the runner: starts each mode, takes screenshots, collects logs.
  # NOT parity evidence: the runner is a VM with no real GPU and a virtual display.
  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spike719-windows-x64
          path: dl
      - name: Unpack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Expand-Archive dl\spike719-windows-x64.zip pkg -Force
          Get-ChildItem pkg\spike719 | Select-Object Name | Format-Table | Out-String | Write-Host
      - name: Runner display and GPU
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SystemInformation]::VirtualScreen | Format-List | Out-String | Write-Host
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table | Out-String | Write-Host
      - name: Smoke modes
        shell: pwsh
        run: |
          foreach ($m in @("a","b-sw-below","b-sw-above","b-gpu-below","b-gpu-above")) {
            ./ci/smoke.ps1 -Mode $m
          }
          ./ci/smoke.ps1 -Mode "a" -Extra "--cef-loop=pump"
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke
          retention-days: 14
          if-no-files-found: warn
