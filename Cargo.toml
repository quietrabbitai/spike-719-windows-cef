# THROWAWAY SPIKE (items.id=719). Never merged into quietrabbit-core. Delete at closure.
[package]
name = "spike719"
version = "0.0.1"
edition = "2021"
publish = false
build = "build.rs"

# FINDING (CI rounds 1-2): CEF 151's Windows sandbox is the bootstrap model. The distribution has no
# cef_sandbox.lib; instead CEF's bootstrap.exe (which contains the sandbox broker) is renamed to the app
# name and loads <app>.dll, calling its exported RunWinMain(). So the application is a cdylib, and
# cef-rs's own bundler (build_util/win, `sandbox` feature) does exactly this copy.
[lib]
name = "spike719"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` (items.id=720): required for a transparent WKWebView on macOS. COMPROMISE (private API, a Mac
# App Store blocker). tauri-build checks only this table, so it is enabled for every platform; it is a no-op on Windows.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# cef's texture importer logs through `tracing`; the `log` feature forwards those to our file logger, which is
# how a silent fallback to its black CPU placeholder texture gets noticed.
tracing = { version = "0.1", features = ["log"] }
# Backend features are per OS (items.id=720): dx12 on Windows (unchanged), metal on macOS.
wgpu = { version = "30", default-features = false, features = ["wgsl", "std", "parking_lot"] }
pollster = "0.4"
# Same pins as quietrabbit-core. `sandbox` makes cef-dll-sys build libcef_dll_wrapper with USE_SANDBOX
# (decisions.id=860: the Chromium sandbox stays enabled).
cef = { version = "151.1.0", features = ["sandbox", "accelerated_osr"] }

# items.id=720 (macOS).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = "line-tables-only"
